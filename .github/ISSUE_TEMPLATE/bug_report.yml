name: Bug report
description: Something doesn't work
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        🔴 **Never paste cookies, tokens, or the contents of your session file.**
        If a log line contains a URL you'd rather not share, redact it — but keep
        the error text itself intact.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, and what you expected instead.
      placeholder: |
        I ran `node launch.js` and expected a Chrome window.
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error output (verbatim)
      description: >
        Paste the output exactly as printed. "It didn't work" is not enough —
        the wording is usually what identifies the cause.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows (native)
        - Windows + WSL
        - macOS
        - Linux (desktop)
        - Linux (headless server)
        - Other
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: node / Chrome versions
      description: "`node --version` and the version shown in chrome://version"
      placeholder: "node v22.14.0, Chrome 151.0.7922.170"
    validations:
      required: true

  - type: textarea
    id: status
    attributes:
      label: Output of `./wb status`
      description: Or `node bin/wbrowser.js status` on Windows.
      render: shell
