name: Feature request
description: Suggest something
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        Describe the task, not the solution. Knowing what you're actually trying
        to accomplish often reveals a simpler answer than the one you had in mind.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you had in mind
      description: Optional — how you imagine it working.
